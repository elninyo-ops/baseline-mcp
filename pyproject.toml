[project]
name = "baseline-mcp"
version = "0.1.8"
description = "Stop your agent inventing climate context: ranked 35-year records for any point on Earth, cross-checked against real stations, with a reliability note to relay."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Chad McNutt", email = "chadmcnutt@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["mcp", "weather", "climate", "era5", "agent-tools", "reanalysis",
            "historical-weather", "seasonal-forecast", "climate-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "mcp[cli]>=1.28.1,<2.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://baselinecontext.com"
Repository = "https://github.com/elninyo-ops/baseline-mcp"
Documentation = "https://github.com/elninyo-ops/baseline-mcp/blob/main/METHODOLOGY.md"
Issues = "https://github.com/elninyo-ops/baseline-mcp/issues"

[project.scripts]
baseline-mcp = "baseline_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Fails the build when server.json's version fields disagree with the one above. See
# hatch_build.py -- the note in CONTRIBUTING.md did not stop three releases drifting.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/baseline_mcp"]
